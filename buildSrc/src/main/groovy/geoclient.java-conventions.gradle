plugins {
    id 'java'
    id 'checkstyle'
    id 'project-report'
    id 'com.diffplug.spotless'
    id 'geoclient.jar-conventions'
}

dependencies {
    // Platforms
    //api platform(project(':platform'))
    // Dependencies
    //implementation('org.springframework.boot:spring-boot-starter-logging')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll("-Werror", "-Xlint:unchecked", "-Xlint:deprecation", "-Xlint:rawtypes","-Xlint:varargs")
}

javadoc {
    description = 'Generates project-level javadoc for use in -javadoc jar'

    options.addStringOption('Xdoclint:none', '-quiet')
    options.author = true
    options.encoding = 'UTF-8'
    //options.header = project.name
    options.memberLevel = JavadocMemberLevel.PROTECTED
    options.noTimestamp = true
    options.use = true
    options.addStringOption(
        'top',
        '<div style="margin:0.75rem 0 1rem 0;padding:0.5rem 0.75rem;'
            + 'background:var(--section-background-color);border:1px solid var(--border-color);'
            + 'border-left:4px solid var(--navbar-background-color);color:var(--block-text-color);">'
            + '<strong style="color:var(--title-color);">New to Geoclient?</strong> '
            + '<a href="https://mlipper.github.io/geoclient/" target="_top">Open the Geoclient User Guide</a>'
            + '</div>'
    )

    // Suppress warnings due to cross-module @see and @link references.
    // Note that global "api" task does display all warnings.
    logging.captureStandardError LogLevel.INFO
    logging.captureStandardOutput LogLevel.INFO  // suppress "## warnings" message
}

