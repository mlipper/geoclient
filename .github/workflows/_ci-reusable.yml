name: CI Reusable

on:
  workflow_call:
    inputs:
      run_integration:
        description: Run integration tests and integration coverage in addition to unit checks.
        required: false
        type: boolean
        default: false
      publish_artifacts:
        description: Upload build artifacts (jar, JUnit XML, coverage XML).
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build, Test, and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build Docker image and extract build outputs
        run: |
          set -euxo pipefail
          tag="${GITHUB_RUN_ID}"
          outdir="${RUNNER_TEMP}/geoclient-dist"
          container_name="geoclient-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build --platform linux/amd64 -f ./ci/Dockerfile -t geoclient:${tag} .
          docker run --name "${container_name}" -d geoclient:${tag}

          mkdir -p "${outdir}"
          docker cp "${container_name}:/app/ci" "${outdir}"
          docker cp "${container_name}:/app/geoclient.jar" "${outdir}"

          echo "OUTDIR=${outdir}" >> "${GITHUB_ENV}"

      - name: Verify unit JUnit XML artifacts
        run: |
          set -euo pipefail
          junitRoot="${OUTDIR}/ci/test-results"
          unitCount=$(find "${junitRoot}" -type f -path '*/test/TEST-*.xml' | wc -l)

          [ "${unitCount}" -gt 0 ] || { echo "Missing unit JUnit XML results under ${junitRoot}"; exit 1; }

          echo "Found unit JUnit XML files: ${unitCount}"
          find "${junitRoot}" -type f -path '*/test/TEST-*.xml' | awk 'NR<=20 { print }'

      - name: Stage unit test results for publish action
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ci-test-results"
          cp -r "${OUTDIR}/ci/test-results" "${GITHUB_WORKSPACE}/ci-test-results"
          ls -la "${GITHUB_WORKSPACE}/ci-test-results"

      - name: Publish unit test results in GitHub checks
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@2ceeed2b8f26e15b06c3846719f75354febd9e7b # v2
        with:
          files: |
            ci-test-results/**/test/TEST-*.xml
          check_name: Unit JUnit Results
          action_fail: true
          fail_on: test failures

      - name: Verify unit coverage artifact
        run: |
          set -euo pipefail
          testCoverage="${OUTDIR}/ci/coverage/test/testCodeCoverageReport.xml"
          [ -f "${testCoverage}" ] || { echo "Missing unit coverage summary: ${testCoverage}"; exit 1; }
          echo "TEST_COVERAGE_XML=${testCoverage}" >> "${GITHUB_ENV}"
          echo "UNIT_COVERAGE_DIR=${OUTDIR}/ci/coverage/test" >> "${GITHUB_ENV}"
          ls -l "${testCoverage}"

      - name: Stage unit coverage file for action
        run: |
          set -euo pipefail
          # Docker-based actions resolve files from /github/workspace, so stage
          # coverage XML into workspace and pass workspace-relative paths.
          cp "${OUTDIR}/ci/coverage/test/testCodeCoverageReport.xml" "${GITHUB_WORKSPACE}/unit-testCodeCoverageReport.xml"
          ls -l "${GITHUB_WORKSPACE}/unit-testCodeCoverageReport.xml"

      - name: Render unit JaCoCo coverage summary
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: unit-testCodeCoverageReport.xml
          token: ${{ github.token }}
          comment-type: summary
          continue-on-error: false

      - name: Upload unit JUnit XML artifacts
        if: always() && inputs.publish_artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: junit-xml-unit
          path: ${{ env.OUTDIR }}/ci/test-results/**/test/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit coverage artifacts
        if: always() && inputs.publish_artifacts && env.UNIT_COVERAGE_DIR != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jacoco-xml-unit
          path: ${{ env.UNIT_COVERAGE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Verify integration JUnit XML artifacts
        if: inputs.run_integration
        run: |
          set -euo pipefail
          junitRoot="${OUTDIR}/ci/test-results"
          integrationCount=$(find "${junitRoot}" -type f -path '*/integrationTest/TEST-*.xml' | wc -l)

          [ "${integrationCount}" -gt 0 ] || { echo "Missing integration JUnit XML results under ${junitRoot}"; exit 1; }

          echo "Found integration JUnit XML files: ${integrationCount}"
          find "${junitRoot}" -type f -path '*/integrationTest/TEST-*.xml' | awk 'NR<=20 { print }'

      - name: Publish integration test results in GitHub checks
        if: always() && inputs.run_integration
        uses: EnricoMi/publish-unit-test-result-action@2ceeed2b8f26e15b06c3846719f75354febd9e7b # v2
        with:
          files: |
            ci-test-results/**/integrationTest/TEST-*.xml
          check_name: Integration JUnit Results
          action_fail: true
          fail_on: test failures

      - name: Verify integration coverage artifact
        if: inputs.run_integration
        run: |
          set -euo pipefail
          integrationCoverage="${OUTDIR}/ci/coverage/integrationTest/integrationTestCodeCoverageReport.xml"

          [ -f "${integrationCoverage}" ] || { echo "Missing coverage summary: ${integrationCoverage}"; exit 1; }

          ls -l "${integrationCoverage}"

      - name: Stage integration coverage file for action
        if: inputs.run_integration
        run: |
          set -euo pipefail
          # Keep integration coverage XML in workspace for Docker action path
          # resolution (avoid host absolute paths like /home/runner/work/...).
          cp "${OUTDIR}/ci/coverage/integrationTest/integrationTestCodeCoverageReport.xml" "${GITHUB_WORKSPACE}/integration-integrationTestCodeCoverageReport.xml"
          ls -l "${GITHUB_WORKSPACE}/integration-integrationTestCodeCoverageReport.xml"

      - name: Render integration JaCoCo coverage summary
        if: inputs.run_integration
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: integration-integrationTestCodeCoverageReport.xml
          token: ${{ github.token }}
          comment-type: summary
          continue-on-error: false

      - name: Upload geoclient jar artifact
        if: inputs.publish_artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: geoclient-jar
          path: ${{ env.OUTDIR }}/geoclient.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload integration JUnit XML artifacts
        if: always() && inputs.publish_artifacts && inputs.run_integration
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: junit-xml-integration
          path: ${{ env.OUTDIR }}/ci/test-results/**/integrationTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload integration coverage artifacts
        if: always() && inputs.publish_artifacts && inputs.run_integration
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jacoco-xml-integration
          path: ${{ env.OUTDIR }}/ci/coverage/integrationTest
          if-no-files-found: error
          retention-days: 14
