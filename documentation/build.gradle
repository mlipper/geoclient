import java.net.URI

plugins {
	alias(libs.plugins.asciidoctor)
	//alias(libs.plugins.asciidoctorPdf)
    id 'geoclient.library-conventions'
    id 'geoclientbuild.apiserver'
    id 'geoclientbuild.documentation'
}

configurations {
    apiServerClasspath {
        canBeConsumed = false
    }
}

dependencies {
    apiServerClasspath(project(path: ':geoclient-service', configuration: 'apiServer'))
}

defaultTasks = ['clean', 'asciidoctor']

def bootJarFile = layout.file(provider {
    project.configurations.apiServerClasspath.singleFile
})

// Configure the ApiServerPlugin which is applied by the DocumentationPlugin
apiserver {
    baseUri = new URI('http://localhost:9090/geoclient/v2')
    serverJar.set(bootJarFile)
    sleepSecondsAfterStart = 12
    sleepSecondsAfterStop = 2
}

tasks.named('startServer') {
    dependsOn(':geoclient-service:dockerJar')
}

asciidoctor {

    dependsOn(tasks.named('build'))
    dependsOn(rootProject.tasks.named('docsPrereqs'))

    baseDirFollowsSourceDir()

    sourceDir file('src/docs/asciidoc')

    sources {
        include 'index.adoc'
        include 'changes.adoc'
    }

    resources {
        from(sourceDir) {
            include 'images/**', 'js/**'
        }
        from(rootProject.tasks.named('aggregateJavadoc')) {
            into 'api'
        }
    }

    attributes docinfo: 'shared',
               idprefix: '',
               idseparator: '-',
               imagesdir: './images',
               sectanchors: true,
               sectlinks: true,
               sectnums: '',
               toc: 'left',
               toclevels: 2,
               'docinfo1': '',
               'source-highlighter': 'rouge',
               'rouge-style': 'monokai'

    // Temporary workaround for https://github.com/asciidoctor/asciidoctor-gradle-plugin/issues/599
    inputs.dir(sourceDir).withPropertyName("sourceDir").withPathSensitivity(PathSensitivity.RELATIVE)

    jvm {
        // To avoid warning, see https://github.com/asciidoctor/asciidoctor-gradle-plugin/issues/597
        jvmArgs(
            "--add-opens", "java.base/sun.nio.ch=ALL-UNNAMED",
            "--add-opens", "java.base/java.io=ALL-UNNAMED"
        )
    }

    notCompatibleWithConfigurationCache("https://github.com/asciidoctor/asciidoctor-gradle-plugin/issues/564")
}

tasks.register('verifyAsciidoctorApiOutput') {
    group = 'verification'
    description = 'Verifies Asciidoctor output contains aggregate API docs at api/index.html.'

    doLast {
        File apiIndex = layout.buildDirectory.file('docs/asciidoc/api/index.html').get().asFile
        if (!apiIndex.exists()) {
            throw new GradleException("Missing expected API docs output: ${apiIndex}. Ensure aggregateJavadoc produces output and is wired into asciidoctor resources.")
        }
    }
}

tasks.named('asciidoctor') {
    finalizedBy(tasks.named('verifyAsciidoctorApiOutput'))
}

tasks.register('showBootJarFile') {
    Directory projectDirectory = layout.projectDirectory
    doLast {
        def theFiles = files(bootJarFile.get().asFile)
        theFiles.collect { projectDirectory.asFile.relativePath(it) }.sort().each { println it }
    }
}
