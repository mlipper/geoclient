plugins {
    id 'geoclient.build-conventions'
    id 'geoclientbuild.aggregate-javadoc'
    id 'test-report-aggregation'
    id 'jacoco-report-aggregation'
}

aggregateJavadocOptions {
    quiet = true
    disableDoclint = true
    failOnError = true
    outputDirectory.set(rootProject.aggregateJavadocOutputDir)
    copyOptionsFrom.set(project.provider { project(':geoclient-core').tasks.getByName('javadoc') })
}

def aggregateReportingProjectPaths = [] as Set

subprojects { subproject ->
    def addAggregationDependency = {
        if (aggregateReportingProjectPaths.add(subproject.path)) {
            rootProject.dependencies.add('testReportAggregation', rootProject.dependencies.project(path: subproject.path))
            rootProject.dependencies.add('jacocoAggregation', rootProject.dependencies.project(path: subproject.path))
        }
    }

    subproject.pluginManager.withPlugin('java') {
        addAggregationDependency()
    }

    subproject.pluginManager.withPlugin('org.springframework.boot') {
        addAggregationDependency()
    }
}

reporting {
    reports {
        testAggregateTestReport(AggregateTestReport) {
            testSuiteName = 'test'
        }

        integrationTestAggregateTestReport(AggregateTestReport) {
            testSuiteName = 'integrationTest'
        }

        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = 'test'
        }

        integrationTestCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = 'integrationTest'
        }
    }
}

tasks.register('docsPrereqs') {
    group = 'documentation'
    description = 'Builds non-documentation subprojects and aggregate Javadoc required for documentation generation.'

    dependsOn(provider {
        rootProject.subprojects
            .findAll { it.path != ':documentation' }
            .collect { it.tasks.named('build') }
    })
}

tasks.named('docsPrereqs') {
    dependsOn(tasks.named('aggregateJavadoc'))
}

tasks.register('continuousIntegrationReports') {
    group = 'verification'
    description = 'Generates aggregate test and coverage reports for CI.'
    dependsOn(
        tasks.named('testAggregateTestReport'),
        tasks.named('integrationTestAggregateTestReport'),
        tasks.named('testCodeCoverageReport'),
        tasks.named('integrationTestCodeCoverageReport')
    )
}