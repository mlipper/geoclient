plugins {
    id 'geoclient.spring-boot-conventions'
}

dependencies {
    implementation project(':geoclient-jni')
    implementation project(':geoclient-core')
    implementation project(':geoclient-parser')
    implementation project(':geoclient-search')

    implementation(libs.commons.text)
    implementation(libs.jackson.annotations)
    implementation(libs.jackson.dataformat.xml)
    implementation(libs.spring.boot.starter.actuator)
    implementation(libs.spring.boot.starter.jackson)
    implementation(libs.spring.boot.starter.tomcat)
    implementation(libs.spring.boot.starter.validation)
    implementation(libs.spring.boot.starter.webmvc)

    testImplementation(libs.spring.boot.starter.jackson.test)
    testImplementation(libs.spring.boot.starter.restclient.test)
    testImplementation(libs.spring.boot.starter.webmvc.test)
}

testing {
    suites {
        integrationTest {
            dependencies {
                implementation project(':geoclient-search')
                implementation(libs.spring.boot.starter.jackson.test)
                implementation(libs.spring.boot.starter.restclient.test)
                implementation(libs.spring.boot.starter.webmvc.test)
            }
        }
    }
}

def writeVersionPropertiesTaskProvider = tasks.register('writeVersionProperties', WriteProperties) {
    properties(['jni.version': project.version, 'core.version': project.version, 'parser.version': project.version, 'service.version': project.version])
    destinationFile = layout.buildDirectory.file('generated-resources/versionProperties/version.properties')
}

processResources {
    from(writeVersionPropertiesTaskProvider)
}

springBoot {
    mainClass = 'gov.nyc.doitt.gis.geoclient.service.GeoclientBootApplication'
    buildInfo() {
        excludes = ['time']
    }
}

tasks.named('bootJar') {
    requiresUnpack "**/geoclient-jni-*.jar"
    manifest {
        from(project.sharedManifest) {
            eachEntry { details ->
                //println("key: ${details.key}, baseValue: ${details.baseValue}, mergeValue: ${mergeValue}")
                if(details.baseValue && details.baseValue != details.mergeValue) {
                    //println("Values differ for key ${details.key}: [baseValue: ${details.baseValue}, mergeValue: ${mergeValue}]")
                    //println("Using baseValue: ${details.baseValue} for key ${details.key}")
                    // Do not overwrite spring-boot's value if both
                    // manifests contain the same key.
                    details.value = details.baseValue
                }
            }
        }
    }
    with(project.jarLicenseFilesSpec)
}

def jarArchiveFileProvider = tasks.named('bootJar') { it.archiveFile }

tasks.register('dockerJar', Copy) {
    dependsOn tasks.named('bootJar')
    from jarArchiveFileProvider
    into layout.buildDirectory.dir('libs')
    rename { 'geoclient.jar' }
}

tasks.named('build') {
    finalizedBy tasks.named('dockerJar')
}

tasks.named('bootRun') {
    args '--spring.profiles.active=bootrun'
}

testing {
    suites {
        integrationTest {
            dependencies {
                implementation(project(':geoclient-core'))
                implementation(project(':geoclient-parser'))
            }
        }
    }
}

// Uses simple sharing strategy. See:
// https://docs.gradle.org/current/userguide/cross_project_publications.html#cross_project_publications
configurations {
    apiServer {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    apiServer(bootJar.archiveFile) {
        builtBy(bootJar)
    }
}
