import org.gradle.nativeplatform.MachineArchitecture
import org.gradle.nativeplatform.OperatingSystemFamily

plugins {
    id 'geoclient.library-conventions'
    id 'geoclient.test-conventions'
}

Provider<Directory> generatedResourcesDirectory = layout.buildDirectory.dir('generated-resources/main')
def hostIsWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def nativeVariantName = hostIsWindows ? 'windows-x64' : 'linux-x64'
def integrationTestExtractDir = layout.buildDirectory.dir('jni-extract/integrationTest')

def syncJniLibTask = tasks.register('syncJniLib', Sync)

// Resolved host-native JNI binary produced by :geoclient-native.
def nativeBinaryClasspath = configurations.create('nativeBinaryClasspath') {
    canBeConsumed = false
    canBeResolved = true
    attributes {
        attribute(OperatingSystemFamily.OPERATING_SYSTEM_ATTRIBUTE,
            objects.named(OperatingSystemFamily, hostIsWindows ? OperatingSystemFamily.WINDOWS : OperatingSystemFamily.LINUX))
        attribute(MachineArchitecture.ARCHITECTURE_ATTRIBUTE,
            objects.named(MachineArchitecture, MachineArchitecture.X86_64))
    }
}

dependencies {
    add('nativeBinaryClasspath', project(path: ':geoclient-native', configuration: 'nativeBinaryElements'))
}

sourceSets {
    main {
        output.dir(generatedResourcesDirectory, builtBy: syncJniLibTask)
    }
}

syncJniLibTask.configure {
    // Preserve runtime layout expected by NativeLibraryLoader.
    dependsOn(nativeBinaryClasspath)
    from(nativeBinaryClasspath)
    into(generatedResourcesDirectory.map {
        it.dir("gov/nyc/doitt/gis/geoclient/jni/${nativeVariantName}")
    })
}

tasks.named('integrationTest') {
    systemProperty 'gc.jni.extract.dir',
        integrationTestExtractDir.get().asFile.absolutePath

    doFirst {
        delete(integrationTestExtractDir)
    }

    // See "GeoclientJniIntegrationTest crashes the JVM on full clean build"
    // in the "Known Issues" section of the User Guide for rationale:
    // Keep this at 1: concurrent forks increase noisy test-event serialization
    // pressure and have triggered intermittent JVM crashes in this module.
    // See hs_err_pid files under geoclient-jni/ from 2026-06-03 investigation.
    maxParallelForks = 1
    testLogging {
        events = ['failed', 'skipped']
        debug.events = ['failed', 'skipped']
        info.events = ['failed', 'skipped']
    }
}

// Exclude from spotless (gradle plugin) license header check because of custom header.
spotless.java {
    targetExclude 'src/main/java/gov/nyc/doitt/gis/geoclient/jni/util/NativeLibraryLocator.java'
}
