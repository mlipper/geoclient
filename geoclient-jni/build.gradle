plugins {
    id 'geoclient.library-conventions'
    id 'geoclient.test-conventions'
}

// ============================================================================
// JNI Native Library Integration
// Syncs native library artifacts from geoclient-native into JNI resources.
// ============================================================================

import java.util.Locale
import org.gradle.api.attributes.Attribute
import org.gradle.api.attributes.Category
import org.gradle.api.attributes.LibraryElements
import org.gradle.api.attributes.Usage
import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.testing.logging.TestLogEvent
import org.gradle.nativeplatform.MachineArchitecture
import org.gradle.nativeplatform.OperatingSystemFamily

// Constants for native library integration
def linkageAttributeName = 'gov.nyc.geoclient.native.linkage'
def nativeBinaryClasspathConfigName = 'nativeBinaryClasspath'
def syncJniLibTaskName = 'syncJniLib'
def integrationTestTaskName = 'integrationTest'
def deleteIntegrationTestExtractDirTaskName = 'deleteIntegrationTestExtractDir'
def generatedResourcesMainDir = 'generated-resources/main'
def jniResourceBaseDir = 'generated-resources/main/gov/nyc/doitt/gis/geoclient/jni/'
def integrationTestExtractDir = 'jni-extract/integrationTest'
def gcJniExtractDirProperty = 'gc.jni.extract.dir'

// Platform detection with validation
def osName = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
def osArch = System.getProperty('os.arch', '').toLowerCase(Locale.ROOT)
def hostIsWindows = osName.contains('windows')
def hostIsLinux = osName.contains('linux')
def hostIsX64 = osArch.contains('amd64') || osArch.contains('x86_64')

//if (!hostIsX64 || (!hostIsWindows && !hostIsLinux)) {
//    throw new GradleException(
//        "Unsupported host platform for geoclient JNI resources. Supported platforms are linux/amd64 and windows/amd64."
//    )
//}

def hostOperatingSystem = hostIsWindows ? OperatingSystemFamily.WINDOWS : OperatingSystemFamily.LINUX
def nativeVariantName = hostIsWindows ? 'windows-x64' : 'linux-x64'

// Layout providers for build directories
def generatedResourcesDirectory = layout.buildDirectory.dir(generatedResourcesMainDir)
def nativeResourceOutputDir = layout.buildDirectory.dir(jniResourceBaseDir + nativeVariantName)
def integrationTestExtractDirProvider = layout.buildDirectory.dir(integrationTestExtractDir)

// Create nativeBinaryClasspath configuration with variant-aware attributes
configurations {
    nativeBinaryClasspath {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage.class, Usage.NATIVE_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category.class, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
                objects.named(LibraryElements.class, 'shared-library'))
            attribute(OperatingSystemFamily.OPERATING_SYSTEM_ATTRIBUTE,
                objects.named(OperatingSystemFamily.class, hostOperatingSystem))
            attribute(MachineArchitecture.ARCHITECTURE_ATTRIBUTE,
                objects.named(MachineArchitecture.class, MachineArchitecture.X86_64))
            attribute(Attribute.of(linkageAttributeName, String.class), 'shared')
        }
    }
}

// Explicit dependency on geoclient-native's shared binary configuration.
dependencies {
    implementation(platform(libs.spring.boot.dependencies))
    implementation(libs.spring.boot.starter.logging)
    testImplementation(libs.spring.boot.starter.test)
    testFixturesImplementation(platform(libs.spring.boot.dependencies))
    testFixturesImplementation(libs.spring.boot.starter.logging)
    nativeBinaryClasspath project(path: ':geoclient-native', configuration: 'nativeBinaryElements')
}

// Register syncJniLib task to sync native libraries into generated resources
def syncJniLibTaskProvider = tasks.register(syncJniLibTaskName, Sync) {
    dependsOn(configurations.nativeBinaryClasspath)
    from(configurations.nativeBinaryClasspath)
    into(nativeResourceOutputDir.get().asFile)
}

// Configure main source set to include generated resources directory
sourceSets.main.output.dir(generatedResourcesDirectory.get().asFile)

// Make 'classes' task depend on syncJniLib to ensure native libs are available
tasks.named('classes').configure {
    dependsOn(syncJniLibTaskProvider)
}

def deleteIntegrationTestExtractDirTaskProvider = tasks.register(deleteIntegrationTestExtractDirTaskName, Delete) {
    delete(integrationTestExtractDirProvider)
}

// Configure integrationTest task: set extraction directory and cleanup
tasks.named(integrationTestTaskName, Test).configure {
    dependsOn(deleteIntegrationTestExtractDirTaskProvider)
    systemProperty(gcJniExtractDirProperty,
        integrationTestExtractDirProvider.get().asFile.absolutePath)
    setMaxParallelForks(1)
    testLogging {
        events TestLogEvent.FAILED, TestLogEvent.SKIPPED
    }
    testLogging.debug {
        events TestLogEvent.FAILED, TestLogEvent.SKIPPED
    }
    testLogging.info {
        events TestLogEvent.FAILED, TestLogEvent.SKIPPED
    }
}

// Exclude from spotless (gradle plugin) license header check because of custom header.
spotless.java {
    targetExclude 'src/main/java/gov/nyc/doitt/gis/geoclient/jni/util/NativeLibraryLocator.java'
}

testing {
    suites {
        integrationTest {
            dependencies {
                implementation(testFixtures(project()))
            }
        }
    }
}
